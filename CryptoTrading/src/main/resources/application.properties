spring.application.name=CryptoTrading
server.port=8080

# Local development values (the EnvValidator class reads these)
DB_URL=jdbc:mysql://localhost:3307/cryptotrading?createDatabaseIfNotExist=true
DB_USERNAME=root
DB_PASSWORD=root
RAZORPAY_API_KEY=dummy_key
RAZORPAY_API_SECRET=dummy_secret
STRIPE_API_KEY=dummy_key

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update

# Payments
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}
stripe.api.key=${STRIPE_API_KEY}

# Public URL of this backend (payment gateways redirect back to <base-url>/api/wallet/deposit)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Email (OTP for 2FA, verification and password reset). For Gmail use an App Password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.root=WARN
logging.level.com.example.CryptoTrading.controller=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.apache.catalina=WARN

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always





